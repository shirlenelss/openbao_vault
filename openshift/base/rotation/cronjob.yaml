apiVersion: batch/v1
kind: CronJob
metadata:
  name: cert-rotator
spec:
  # Weekly - CERT_TTL below requests 90-day certs, so this renews each one
  # ~12x before it would ever actually near expiry. Always reissues/
  # overwrites on every run rather than tracking what's due; at this
  # schedule-vs-TTL ratio that's simpler than it is wasteful.
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: cert-rotator
          restartPolicy: Never
          initContainers:
            - name: fetch
              image: curlimages/curl:8.11.1
              command: ["/bin/sh", "/scripts/fetch.sh"]
              env:
                - name: ENVIRONMENT
                  value: test
                - name: CERT_TTL
                  value: "2160h"
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: work
                  mountPath: /work
          containers:
            - name: apply
              image: alpine/k8s:1.31.1
              command: ["/bin/sh", "/scripts/apply.sh"]
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: work
                  mountPath: /work
          volumes:
            - name: scripts
              configMap:
                name: cert-rotate-scripts
                defaultMode: 0755
            - name: work
              emptyDir: {}
