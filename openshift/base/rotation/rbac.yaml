apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-rotator
rules:
  # No resourceNames - the CronJob creates these secrets on first run, so
  # they can't be pre-listed. Scoped to Secrets only, namespace-scoped Role.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-rotator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-rotator
subjects:
  - kind: ServiceAccount
    name: cert-rotator
