# Template only - not applied by kustomization.yaml, and never commit a real
# token here. Create the actual secret out-of-band instead, e.g.:
#
#   oc create secret generic openbao-token --from-literal=token=<vault-token>
#
# The Deployment reads this via secretKeyRef and expects the secret to exist
# in the target namespace before the Deployment is applied.
apiVersion: v1
kind: Secret
metadata:
  name: openbao-token
type: Opaque
stringData:
  token: REPLACE_ME
